# Optional overlay: mount the host's Claude Code credentials into the engine so jobs run on
# your logged-in Claude subscription instead of an API key.
#
#   docker compose -f docker-compose.yml -f docker-compose.claude.yml up -d
#
# (setup.sh enables this automatically by writing COMPOSE_FILE=... into .env.)
#
# LINUX ONLY. On macOS this is broken twice over: the CLI keeps its OAuth credentials in the
# system Keychain (not ~/.claude), and the host CLI rewrites ~/.claude.json while the stack
# runs — reads through a single-file bind mount then appear torn, and the engine fails with
# "Claude configuration file ... is corrupted". On macOS use `claude setup-token` on the host
# and `CLAUDE_CODE_OAUTH_TOKEN=<token> ./setup.sh` instead (setup.sh won't pick this mount on
# macOS by itself).
services:
  engine:
    volumes:
      - ${HOME}/.claude:/home/shire/.claude
      - ${HOME}/.claude.json:/home/shire/.claude.json
