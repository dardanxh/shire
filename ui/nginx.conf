server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Everything the backend serves lives under /api/v1 — REST routes and the static artifact
    # mounts (graph-artifacts, artifacts, cc-viewer) the UI iframes same-origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Synchronous tool-run endpoints can take minutes on large repos.
        proxy_read_timeout 600s;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
