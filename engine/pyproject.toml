[project]
name = "shire-engine"
version = "0.1.0"
description = "Shire engine service — claims jobs from Postgres and runs them through an LLM engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
