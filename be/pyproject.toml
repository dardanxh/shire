[project]
name = "hobits-be"
version = "0.1.0"
description = "Hobits backend — repo-intelligence substrate"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "gitpython>=3.1.43",
    "httpx>=0.27",
    "cryptography>=44.0",
    "pgvector>=0.3.6",
    "lizard>=1.23.0",
    "radon>=6.0.1",
    "ruff>=0.15.20",
    "bandit>=1.9.4",
    "vulture>=2.16",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hobits"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "TID",           # tidy imports
    "RUF",
]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["hobits"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
